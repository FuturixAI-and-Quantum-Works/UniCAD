[project]
name = "unicad"
version = "0.0.1"
description = "MCP server for solar EPC drawing sets (SLDs, layouts, schedules) rendered through LibreCAD"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pillow>=10",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.scripts]
unicad-mcp = "unicad.mcp.cli:main"

[project.optional-dependencies]
preview = ["pymupdf>=1.24", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "pymupdf>=1.24", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unicad"]

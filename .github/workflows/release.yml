# A tag vX.Y.Z builds the wheel and publishes a GitHub release with it and opencad-mcp.json, which OpenCAD reads to
# install UniCAD (uv tool install <wheel>). The tag, pyproject.toml and opencad-mcp.json must name the same version.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the versions agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          manifest=$(python3 -c 'import json; print(json.load(open("opencad-mcp.json"))["version"])')
          echo "tag $tag, pyproject $project, opencad-mcp.json $manifest"
          test "$tag" = "$project" && test "$tag" = "$manifest"
      - name: Build the wheel
        run: uv build --wheel -o dist
      - name: Smoke-test the wheel
        run: |
          uv tool install --python 3.13 dist/*.whl
          unicad-mcp --help
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl opencad-mcp.json --title "UniCAD $GITHUB_REF_NAME" --generate-notes

  # The self-contained runtime OpenCAD ships (tools/build_runtime.py): CPython + UniCAD + dependencies, one per
  # platform, attached to the same release. OpenCAD's packaging puts it in the app; users need no Python or uv.
  runtime:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the runtime
        shell: bash
        run: uv run --no-project python tools/build_runtime.py --archive
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/unicad-runtime-* --clobber  # the .tar.gz, or the .zip on Windows
